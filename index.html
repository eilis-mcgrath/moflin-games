<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moflin Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}

:root{
  --bg:#C9D4F6;
  --ink:#33285A;
  --btn:#FFFFFF;
  --btn-ink:#33285A;
  --focus:#33285A;
  --shadow:rgba(51,40,90,.26);
  --floor:#EEF7E8;
  --wall:#2E9C8C;
  --wall-dark:#1D6B62;
  --wall-light:#63C7B5;
  --stitch:#EEF7E8;
  --heart:#F0625A;
  --heart-light:#FF9C8F;
  --glow:#FFC83D;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#24244A;--ink:#F2EEFF;--btn:#3B3C72;--btn-ink:#F2EEFF;--focus:#FFC83D;--shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#24244A;--ink:#F2EEFF;--btn:#3B3C72;--btn-ink:#F2EEFF;--focus:#FFC83D;--shadow:rgba(0,0,0,.45);
}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;
  background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
button:focus-visible,#moflin:focus-visible .tilt{outline:4px solid var(--focus);outline-offset:3px}
#moflin:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;position:relative}
.screen{height:100%;display:flex;flex-direction:column}

/* ---------- pick screen ---------- */
#home h1,#pick h1,#vehicle h1{
  margin:0;padding:20px 16px 0;text-align:center;
  font-size:clamp(34px,7vw,56px);font-weight:600;line-height:1.1;letter-spacing:.01em;
}
.choices{
  flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:8px;
  align-content:space-evenly;justify-content:space-evenly;padding:8px 16px 20px;
}
@media (min-aspect-ratio:5/4){.choices{flex-wrap:nowrap;align-items:center}}
.pick{
  position:relative;width:var(--pick,120px);height:var(--pick,120px);
  padding:0;border:0;background:none;cursor:pointer;border-radius:50%;
  display:block;
}
.pick .ground{
  position:absolute;left:20%;right:20%;bottom:4%;height:8%;
  border-radius:50%;background:var(--shadow);filter:blur(3px);
}
.pick .bob{display:block;position:absolute;inset:0;animation:bob 3.4s ease-in-out infinite}
.pick:nth-child(2) .bob{animation-delay:-1.1s}
.pick:nth-child(3) .bob{animation-delay:-2.2s}
.pick:nth-child(4) .bob{animation-delay:-.6s}
.pick svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 85%;transition:scale .12s}
.pick:active svg{scale:.94}
#pick h1,#vehicle h1{padding-top:0}

/* ---------- home screen ---------- */
.tiles{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,var(--tile,150px));gap:14px;
  justify-content:center;align-content:center;padding:16px;
}
@media (min-aspect-ratio:5/4){.tiles{grid-template-columns:repeat(4,var(--tile,150px))}}
.tile{
  position:relative;width:var(--tile,150px);height:var(--tile,150px);padding:0;border:0;cursor:pointer;
  overflow:hidden;background:var(--tile-bg);border-radius:calc(var(--tile,150px)*.17);
  box-shadow:0 6px 0 var(--shadow);transition:transform .12s,box-shadow .12s;
}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
.tile .art{position:absolute;inset:0;display:block;animation:tilePulse 3.8s ease-in-out infinite}
.tile:nth-child(2) .art{animation-delay:-.9s}
.tile:nth-child(3) .art{animation-delay:-1.8s}
.tile:nth-child(4) .art{animation-delay:-2.7s}
.tile .art svg{display:block;width:100%;height:100%}
.tile.soon .art svg{filter:saturate(.55)}
.tile .tag{
  position:absolute;left:50%;bottom:calc(var(--tile,150px)*.05);transform:translateX(-50%);
  background:rgba(255,255,255,.92);color:#33285A;border-radius:999px;padding:.05em .75em;
  font-weight:600;font-size:clamp(13px,calc(var(--tile,150px)*.1),24px);line-height:1.5;white-space:nowrap;
}
.tile .zzz{position:absolute;top:calc(var(--tile,150px)*.05);right:calc(var(--tile,150px)*.05);width:calc(var(--tile,150px)*.22);height:calc(var(--tile,150px)*.22)}
.tile .zzz svg{display:block;width:100%;height:100%}
.zz{position:absolute;font-weight:600;color:#33285A;pointer-events:none;font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif}

/* ---------- play screen ---------- */
#play{display:flex}
.bar{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:72px}
.bar .grow{flex:1}
.icon-btn{
  width:56px;height:56px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-ink);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 0 var(--shadow);
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.icon-btn:not(.moflin-btn) svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.moflin-btn svg{display:block;width:46px;height:46px;overflow:visible}

#stage{flex:1;min-height:0;display:grid;place-items:center;padding:6px 12px}
#board{position:relative;--S:40px}
#floor{
  position:absolute;inset:0;border-radius:calc(var(--S)*.55);background:var(--floor);
  box-shadow:0 calc(var(--S)*.14) 0 var(--shadow);
}
#maze{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;overflow:visible}
.w-shadow{stroke:var(--wall-dark)}
.w-main{stroke:var(--wall)}
.w-light{stroke:var(--wall-light);opacity:.55}
.w-stitch{stroke:var(--stitch);opacity:.9}
.goal-glow{fill:var(--glow);opacity:.45;transform-box:fill-box;transform-origin:center;animation:glow 2.2s ease-in-out infinite}
.tube-flow{animation:flow 1.1s linear infinite}
.swirl{transform-box:fill-box;transform-origin:center;animation:swirl 2.8s linear infinite}

#nestFront{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
#moflin{
  position:absolute;left:0;top:0;
  width:calc(var(--S)*2.4);height:calc(var(--S)*2.4);
  touch-action:none;cursor:grab;will-change:transform;
}
#moflin.held{cursor:grabbing}
#moflin .mshadow{
  position:absolute;left:50%;top:50%;
  width:calc(var(--S)*.86);height:calc(var(--S)*.22);
  margin:calc(var(--S)*.3) 0 0 calc(var(--S)*-.43);
  border-radius:50%;background:var(--shadow);filter:blur(2px);pointer-events:none;
}
#moflin .ring{
  position:absolute;left:50%;top:50%;
  width:calc(var(--S)*1.15);height:calc(var(--S)*1.15);
  margin:calc(var(--S)*-.575) 0 0 calc(var(--S)*-.575);
  border-radius:50%;border:calc(var(--S)*.08) solid var(--heart);
  opacity:0;pointer-events:none;
}
#moflin.invite .ring{animation:ring 1.5s ease-out infinite}
#moflin .tilt{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  transition:scale .12s;
}
#moflin.held .tilt{scale:1.07}
.jumper{width:calc(var(--S)*1.25);height:calc(var(--S)*1.25);transform-origin:50% 85%}
.jumper.sliding{transform-origin:50% 50%}
.jumper svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 88%;animation:breathe 3.6s ease-in-out infinite}

.eyes-happy{display:none}
.happy .eyes-open{display:none}
.happy .eyes-happy{display:inline}
.eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

#hand{
  position:absolute;left:0;top:0;width:calc(var(--S)*1.6);
  opacity:0;pointer-events:none;z-index:6;will-change:transform;
}
#hand svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(51,40,90,.25))}

.footer{min-height:88px;display:grid;place-items:center}
.again{
  width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;
  background:var(--heart);color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(0,0,0,.2);
  visibility:hidden;opacity:0;transform:scale(.6);
}
.again svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.again.show{visibility:visible;animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
.again:active{filter:brightness(.95)}

/* ---------- particles ---------- */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.conf{position:absolute;will-change:transform}
.fh{position:absolute;will-change:transform}
.fh svg{display:block;width:100%;height:100%}


/* ---------- dress up ---------- */
#dress .bar{gap:8px;padding:8px 10px}
#dress .icon-btn{width:52px;height:52px}
#dress .icon-btn.camera{width:62px;height:62px;background:var(--heart);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.22)}
#dress .icon-btn.camera svg{width:34px;height:34px}
#dress .moflin-btn svg{width:42px;height:42px}
#dstage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;padding:4px 10px}
#dstage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 62% 56% at 50% 46%,rgba(255,255,255,.6),rgba(255,255,255,0) 72%);
}
#dwrap{position:relative;width:var(--dm,260px);height:var(--dm,260px);touch-action:none}
#dwrap .rug{
  position:absolute;left:6%;right:6%;top:67%;height:22%;border-radius:50%;background:#FFF1D9;
  box-shadow:0 5px 0 var(--shadow),inset 0 0 0 4px rgba(255,255,255,.7);pointer-events:none;
}
#dwrap .rug::after{content:"";position:absolute;inset:9%;border-radius:50%;border:3px dashed rgba(51,40,90,.18)}
#dwrap .dshadow{position:absolute;left:29%;right:29%;top:74%;height:8%;border-radius:50%;background:var(--shadow);filter:blur(3px);pointer-events:none}
#dm{position:absolute;inset:0;transform-origin:50% 80%}
#dm svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 84%;animation:breathe 3.6s ease-in-out infinite}
#dwrap.over #dm{filter:drop-shadow(0 0 12px #FFC83D)}
.worn{cursor:grab}
.pop{transform-box:fill-box;transform-origin:50% 80%}

.tray{padding:6px 12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.tabs{display:flex;gap:12px}
.tab{
  width:60px;height:60px;border-radius:50%;border:0;background:var(--btn);padding:9px;cursor:pointer;
  box-shadow:0 3px 0 var(--shadow);display:grid;place-items:center;
}
.tab svg{width:100%;height:100%;display:block;pointer-events:none}
.tab[aria-selected="true"]{background:#FFC83D;box-shadow:0 3px 0 rgba(0,0,0,.22),0 0 0 4px var(--btn)}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,86px));gap:10px;justify-content:center;width:100%}
.item{
  aspect-ratio:1;border:0;border-radius:20px;background:var(--ib,var(--btn));padding:9px;cursor:grab;
  box-shadow:0 4px 0 var(--shadow);display:grid;place-items:center;touch-action:none;
}
.item svg{width:100%;height:100%;display:block;pointer-events:none}
.item:active{transform:translateY(2px)}
.dragitem{position:fixed;left:0;top:0;width:104px;height:104px;pointer-events:none;z-index:60;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28))}
.dragitem svg{width:100%;height:100%;display:block;overflow:visible}
#dhand{position:fixed;left:0;top:0;width:64px;opacity:0;pointer-events:none;z-index:55}
#dhand svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(51,40,90,.25))}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
.sp{position:absolute;pointer-events:none}
.sp svg{display:block;width:100%;height:100%}
.polaroid{
  position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(56vw,240px);
  background:#fff;padding:10px 10px 38px;border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.3);
  pointer-events:auto;transform:translate(-50%,120%) rotate(-12deg);
}
.polaroid .pic{aspect-ratio:1;border-radius:3px;overflow:hidden;background:linear-gradient(160deg,#FFE3F0,#DCE6FF)}
.polaroid .pic svg{display:block;width:100%;height:100%}
@media (min-aspect-ratio:5/4){
  #dress{display:grid;grid-template-columns:1fr minmax(300px,36%);grid-template-rows:auto 1fr}
  #dress .bar{grid-column:1/-1}
  #dstage{grid-row:2;grid-column:1}
  .tray{grid-row:2;grid-column:2;justify-content:center}
}

/* ---------- races ---------- */
#vehicle .bar,#race .bar{gap:8px;padding:8px 10px}
#race .icon-btn{width:52px;height:52px}
#race .moflin-btn svg,#vehicle .moflin-btn svg{width:42px;height:42px}
.rstage{flex:1;min-height:0;position:relative;padding:4px 10px 6px}
#lanes{
  position:relative;height:100%;border-radius:22px;overflow:hidden;
  display:grid;grid-template-rows:repeat(4,minmax(0,1fr));box-shadow:0 5px 0 var(--shadow);
}
.lane{position:relative;overflow:hidden;touch-action:none}
.lane.mine::after{content:"";position:absolute;inset:0;border:3px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px rgba(255,200,61,.95);pointer-events:none;z-index:3}
.racer{position:absolute;left:0;top:0;width:var(--vw);height:var(--vh);will-change:transform;pointer-events:none;z-index:2}
.rbody{width:100%;height:100%;transform-origin:50% 90%}
.rbody svg{display:block;width:100%;height:100%;overflow:visible}
.prop{transform-box:fill-box;transform-origin:center;animation:prop .1s linear infinite}
.puff{position:absolute;border-radius:50%;pointer-events:none;z-index:1}
.startline{position:absolute;top:0;bottom:0;left:var(--sl,20px);width:4px;background:rgba(255,255,255,.8);z-index:1;pointer-events:none}
.finishline{position:absolute;top:0;bottom:0;left:var(--fin,280px);width:14px;background:repeating-conic-gradient(#33285A 0 25%,#fff 0 50%) 0 0/14px 14px;z-index:1;pointer-events:none}
.medal{
  position:absolute;top:50%;left:calc(var(--fin,280px) + 22px);width:34px;height:34px;margin-top:-17px;border-radius:50%;
  display:grid;place-items:center;font-weight:600;font-size:20px;color:#33285A;box-shadow:0 3px 0 rgba(0,0,0,.22);z-index:4;
}
.medal.m1{background:#FFC83D}.medal.m2{background:#D5DBE6}.medal.m3{background:#E0A06A}.medal.m4{background:#C8CCF5}
#countdown{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:124px;height:124px;border-radius:50%;
  display:grid;place-items:center;font-size:58px;font-weight:600;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.22);pointer-events:none;z-index:6;
}
/* the four racing tracks */
.t-car .lane{background:linear-gradient(#5B5F7A,#5B5F7A)}
.t-car .lane::before{content:"";position:absolute;left:0;right:0;bottom:2px;height:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 22px,transparent 22px 44px)}
.t-train .lane{background:
  linear-gradient(#9AA0AE,#9AA0AE) 0 60%/100% 3px no-repeat,
  linear-gradient(#9AA0AE,#9AA0AE) 0 82%/100% 3px no-repeat,
  repeating-linear-gradient(90deg,#8A6A4A 0 8px,transparent 8px 26px) 0 56%/100% 32% no-repeat,#D4C39B}
.t-plane .lane{background:
  radial-gradient(ellipse 30px 12px at 14% 34%,rgba(255,255,255,.9) 62%,transparent 64%),
  radial-gradient(ellipse 22px 9px at 46% 22%,rgba(255,255,255,.85) 62%,transparent 64%),
  radial-gradient(ellipse 28px 11px at 71% 40%,rgba(255,255,255,.9) 62%,transparent 64%),
  linear-gradient(#A9D8F5,#CBEAFB)}
.t-plane .lane:nth-child(even){filter:brightness(1.04)}
.t-horse .lane{background:
  repeating-linear-gradient(90deg,#A9754A 0 5px,transparent 5px 36px) 0 0/100% 16px no-repeat,
  linear-gradient(#A9754A,#A9754A) 0 12px/100% 3px no-repeat,
  linear-gradient(transparent 26%,#E7C994 26% 96%,transparent 96%),#8FD08B}
.t-horse .lane:nth-child(even){background-color:#9BDA97}
@keyframes prop{50%{transform:scaleY(.35)}}

/* ---------- spelling ---------- */
#spell .bar{gap:8px;padding:8px 10px}
#spell .icon-btn{width:52px;height:52px}
#spell .moflin-btn svg{width:42px;height:42px}
#sboard{flex:1;min-height:0;position:relative;margin:0 10px 8px;touch-action:none;--b:80px}
.spic{
  position:absolute;border:0;padding:0;border-radius:28px;background:#fff;box-shadow:0 6px 0 var(--shadow);
  display:grid;place-items:center;cursor:pointer;overflow:hidden;touch-action:manipulation;
}
.spic span{line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;pointer-events:none}
.sband{position:absolute;border-radius:26px;background:rgba(255,255,255,.42);pointer-events:none}
.sslot{
  position:absolute;border-radius:calc(var(--b)*.24);border:3px dashed rgba(51,40,90,.4);background:rgba(255,255,255,.6);
  pointer-events:none;transition:background .12s,border-color .12s;
}
.sslot.hot{background:rgba(255,200,61,.55);border-color:#FFC83D}
.sslot.ok{border-color:transparent;background:transparent}
.sblock{
  position:absolute;left:0;top:0;width:var(--b);height:var(--b);border-radius:calc(var(--b)*.24);
  display:grid;place-items:center;color:#fff;font-weight:600;line-height:1;cursor:grab;touch-action:none;
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:calc(var(--b)*.62);
  box-shadow:0 5px 0 rgba(0,0,0,.2);will-change:transform;-webkit-user-select:none;user-select:none;
}
.sblock::after{content:"";position:absolute;inset:7%;border-radius:calc(var(--b)*.2);border:2px solid rgba(255,255,255,.4);pointer-events:none}
.sblock.lift{cursor:grabbing;box-shadow:0 12px 14px rgba(0,0,0,.25);z-index:5}
.sblock.placed{cursor:default}
.smoflin{position:absolute;cursor:pointer}
.smoj{width:100%;height:100%;transform-origin:50% 85%}
.smoj svg{display:block;width:100%;height:100%;overflow:visible;animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 88%}
.snext{
  position:absolute;border-radius:50%;border:0;cursor:pointer;background:var(--heart);color:#fff;
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2);visibility:hidden;opacity:0;transform:scale(.6);
}
.snext svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.snext.show{visibility:visible;animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes tilePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5%)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,1.035)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes glow{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.65;transform:scale(1.12)}}
@keyframes ring{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes pop{to{transform:scale(1);opacity:1}}
.wsparkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes flow{to{stroke-dashoffset:-.35}}
@keyframes swirl{to{transform:rotate(360deg)}}

@media (max-height:560px){
  .bar{min-height:56px;padding:4px 10px}
  .icon-btn{width:46px;height:46px}
  .footer{min-height:64px}
  .again{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){
  .pick .bob,.tile .art,.eyes-open,.goal-glow,.jumper svg,#dm svg,.smoj svg,.tube-flow,.swirl,.wsparkle{animation:none!important}
  #moflin.invite .ring{animation:none;opacity:.8}
}
</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen">
    <h1>Moflin Play</h1>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="pick" class="screen" hidden>
    <div class="bar">
      <button class="icon-btn" id="pickHome" type="button" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
      </button>
    </div>
    <h1 id="pickTitle">Moflin Maze</h1>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

/*LOGIC-START*/
// Maze logic. Everything is measured in "tiles" (1 tile = 1 grid square).
const WALL_W = 0.72, HALF = WALL_W / 2, RAD = 0.38, MINDIST = HALF + RAD;
const HURDLE_MIN = 0.5;
const CHUTE_COLORS = ['#8E6BE8', '#3E9BF2', '#F2A93B'];
let g = null, COLS = 0, ROWS = 0, segs = [], hsegs = [], hurdles = [], chutes = [], ladders = [];
let goal = {x:0, y:0}, distGoal = null;
const pos = {x:1.5, y:1.5};

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function bfs(sx, sy){
  const d = Array.from({length:ROWS}, () => Array(COLS).fill(-1));
  const q = [[sx, sy]];
  d[sy][sx] = 0;
  for (let i = 0; i < q.length; i++){
    const [x, y] = q[i];
    for (const [dx, dy] of DIRS){
      const nx = x + dx, ny = y + dy;
      if (g[ny][nx] === 0 && d[ny][nx] < 0){ d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return d;
}

// can the goal be reached from the start if these tiles are closed?
function reachable(blocked){
  const gx = Math.floor(goal.x), gy = Math.floor(goal.y);
  const seen = new Set(['1,1']), q = [[1, 1]];
  for (let i = 0; i < q.length; i++){
    const [x, y] = q[i];
    if (x === gx && y === gy) return true;
    for (const [dx, dy] of DIRS){
      const nx = x + dx, ny = y + dy, key = nx + ',' + ny;
      if (g[ny][nx] === 0 && !seen.has(key) && !blocked.has(key)){ seen.add(key); q.push([nx, ny]); }
    }
  }
  return false;
}

function tracePath(){
  const p = [[1, 1]];
  let x = 1, y = 1;
  while (distGoal[y][x] > 0){
    let nxt = null;
    for (const [dx, dy] of DIRS){
      const nx = x + dx, ny = y + dy;
      if (g[ny][nx] === 0 && distGoal[ny][nx] === distGoal[y][x] - 1){ nxt = [nx, ny]; break; }
    }
    if (!nxt) break;
    x = nxt[0]; y = nxt[1]; p.push([x, y]);
  }
  return p;
}

function buildOnce(w, h, feat){
  COLS = 2 * w + 1; ROWS = 2 * h + 1;
  g = Array.from({length:ROWS}, () => Array(COLS).fill(1));
  const seen = Array.from({length:h}, () => Array(w).fill(false));
  const stack = [[0, 0]];
  seen[0][0] = true; g[1][1] = 0;
  while (stack.length){
    const [cx, cy] = stack[stack.length - 1];
    const opts = [];
    for (const [dx, dy] of DIRS){
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && ny >= 0 && nx < w && ny < h && !seen[ny][nx]) opts.push([nx, ny, dx, dy]);
    }
    if (!opts.length){ stack.pop(); continue; }
    const [nx, ny, dx, dy] = opts[Math.floor(Math.random() * opts.length)];
    g[2*cy + 1 + dy][2*cx + 1 + dx] = 0;
    g[2*ny + 1][2*nx + 1] = 0;
    seen[ny][nx] = true;
    stack.push([nx, ny]);
  }
  // a few extra doorways so there is more than one way round
  const cand = [];
  for (let y = 1; y < ROWS - 1; y++){
    for (let x = 1; x < COLS - 1; x++){
      if (g[y][x] === 1 && ((x % 2 === 1 && y % 2 === 0) || (x % 2 === 0 && y % 2 === 1))) cand.push([x, y]);
    }
  }
  shuffle(cand);
  const extra = Math.max(1, Math.round(w * h / 9));
  for (let i = 0; i < extra && i < cand.length; i++) g[cand[i][1]][cand[i][0]] = 0;

  // the heart cushion goes in the cell furthest from the start
  const d0 = bfs(1, 1);
  let best = [1, 1], bd = -1;
  for (let y = 1; y < ROWS; y += 2){
    for (let x = 1; x < COLS; x += 2){
      if (d0[y][x] > bd){ bd = d0[y][x]; best = [x, y]; }
    }
  }
  goal = {x: best[0] + 0.5, y: best[1] + 0.5};
  distGoal = bfs(best[0], best[1]);

  // wall skeleton: line segments joining the centres of neighbouring wall tiles
  segs = [];
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      if (g[y][x] !== 1) continue;
      const cx = x + 0.5, cy = y + 0.5;
      let linked = false;
      if (x + 1 < COLS && g[y][x + 1] === 1){ segs.push([cx, cy, cx + 1, cy, MINDIST]); linked = true; }
      if (y + 1 < ROWS && g[y + 1][x] === 1){ segs.push([cx, cy, cx, cy + 1, MINDIST]); linked = true; }
      if (!linked && ((x > 0 && g[y][x - 1] === 1) || (y > 0 && g[y - 1][x] === 1))) linked = true;
      if (!linked) segs.push([cx, cy, cx, cy, MINDIST]);
    }
  }
  placeExtras(w, h, feat);
}

// build a maze with the requested extras; try again (a few times) if some could not be placed
function buildMaze(w, h, feat = {hurdles:1, chutes:1, ladders:1}){
  for (let attempt = 0; attempt < 30; attempt++){
    buildOnce(w, h, feat);
    if (hurdles.length >= feat.hurdles && chutes.length >= feat.chutes && ladders.length >= feat.ladders) break;
  }
}

// hurdles sit on the route (and only where there is no way round);
// chute mouths sit off the route and slide you back to an earlier spot
function placeExtras(w, h, feat){
  hurdles = []; hsegs = []; chutes = []; ladders = [];
  const path = tracePath();
  const onPath = new Set(path.map(p => p[0] + ',' + p[1]));

  const wantH = feat.hurdles;
  const idxs = [];
  for (let i = 3; i < path.length - 3; i++){
    const [x, y] = path[i];
    if ((x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0)) idxs.push(i);
  }
  shuffle(idxs);
  const chosen = [];
  for (const i of idxs){
    if (chosen.length >= wantH) break;
    if (chosen.some(j => Math.abs(j - i) < 6)) continue;
    const [x, y] = path[i];
    if (reachable(new Set([x + ',' + y]))) continue;
    chosen.push(i);
  }
  for (const i of chosen){
    const [x, y] = path[i];
    const axis = (y % 2 === 1) ? 'x' : 'y';
    const cx = x + 0.5, cy = y + 0.5;
    hurdles.push({x, y, cx, cy, axis});
    hsegs.push(axis === 'x' ? [cx, cy - 0.7, cx, cy + 0.7, HURDLE_MIN] : [cx - 0.7, cy, cx + 0.7, cy, HURDLE_MIN]);
  }

  // regions separated by hurdles, so a chute can never carry you past one
  const d0 = bfs(1, 1);
  const closed = new Set(hurdles.map(hd => hd.x + ',' + hd.y));
  const comp = Array.from({length:ROWS}, () => Array(COLS).fill(-1)), compMin = [];
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      if (g[y][x] !== 0 || comp[y][x] >= 0 || closed.has(x + ',' + y)) continue;
      const id = compMin.length, q = [[x, y]];
      let mn = Infinity;
      comp[y][x] = id;
      for (let i = 0; i < q.length; i++){
        const [cx, cy] = q[i];
        mn = Math.min(mn, d0[cy][cx]);
        for (const [dx, dy] of DIRS){
          const nx = cx + dx, ny = cy + dy;
          if (g[ny][nx] === 0 && comp[ny][nx] < 0 && !closed.has(nx + ',' + ny)){ comp[ny][nx] = id; q.push([nx, ny]); }
        }
      }
      compMin.push(mn);
    }
  }

  // ladders lift you forward (never past a hurdle): one shortcut on the route, one reward in a side branch
  const used = new Set();
  const key = (x, y) => x + ',' + y;
  const routeCells = [];
  path.forEach((p, i) => { if (p[0] % 2 === 1 && p[1] % 2 === 1) routeCells.push(i); });
  const kinds = feat.ladders <= 0 ? [] : feat.ladders >= 2 ? ['route', 'side'] : [Math.random() < 0.5 ? 'route' : 'side'];
  for (const kind of kinds){
    let made = false;
    const addLadder = (bx, by, tx, ty) => {
      ladders.push({bx: bx + 0.5, by: by + 0.5, tx: tx + 0.5, ty: ty + 0.5, kind});
      used.add(key(bx, by)); used.add(key(tx, ty)); made = true;
    };
    if (kind === 'route'){
      for (const i of shuffle(routeCells.slice())){
        if (made) break;
        if (i < 2) continue;
        for (const j of shuffle(routeCells.slice())){
          if (j < i + 6 || j > i + 14 || j > path.length - 3) continue;
          if (chosen.some(k => k > i && k <= j)) continue;
          const [bx, by] = path[i], [tx, ty] = path[j];
          if (Math.hypot(tx - bx, ty - by) < 3 || used.has(key(bx, by)) || used.has(key(tx, ty))) continue;
          addLadder(bx, by, tx, ty);
          break;
        }
      }
    } else {
      const bottoms = [];
      for (let y = 1; y < ROWS; y += 2){
        for (let x = 1; x < COLS; x += 2){
          if (g[y][x] === 0 && !onPath.has(key(x, y)) && d0[y][x] >= 4) bottoms.push([x, y]);
        }
      }
      const isDead = ([x, y]) => DIRS.filter(([dx, dy]) => g[y + dy][x + dx] === 0).length === 1;
      for (const [x, y] of shuffle(bottoms.filter(isDead)).concat(shuffle(bottoms.filter(b => !isDead(b))))){
        if (made) break;
        if (used.has(key(x, y))) continue;
        for (const j of shuffle(routeCells.slice())){
          if (j > path.length - 3) continue;
          const [tx, ty] = path[j];
          if (used.has(key(tx, ty)) || comp[ty][tx] !== comp[y][x]) continue;
          if (distGoal[ty][tx] > distGoal[y][x] - 6 || Math.hypot(tx - x, ty - y) < 3) continue;
          addLadder(x, y, tx, ty);
          break;
        }
      }
    }
  }

  const wantC = feat.chutes;
  const deg = (x, y) => DIRS.filter(([dx, dy]) => g[y + dy][x + dx] === 0).length;
  const cells = [];
  for (let y = 1; y < ROWS; y += 2){
    for (let x = 1; x < COLS; x += 2){
      if (g[y][x] === 0 && !onPath.has(x + ',' + y) && d0[y][x] >= 8) cells.push([x, y]);
    }
  }
  const order = shuffle(cells.filter(([x, y]) => deg(x, y) === 1)).concat(shuffle(cells.filter(([x, y]) => deg(x, y) !== 1)));
  for (const [x, y] of order){
    if (chutes.length >= wantC) break;
    if (used.has(x + ',' + y)) continue;
    if (chutes.some(c => Math.abs(c.hx - (x + 0.5)) + Math.abs(c.hy - (y + 0.5)) < 4)) continue;
    const opts = [];
    for (let y2 = 1; y2 < ROWS; y2 += 2){
      for (let x2 = 1; x2 < COLS; x2 += 2){
        if (g[y2][x2] !== 0 || used.has(x2 + ',' + y2)) continue;
        if (d0[y2][x2] > d0[y][x] - 6) continue;
        if (compMin[comp[y2][x2]] > compMin[comp[y][x]]) continue;
        if (Math.hypot(x2 - x, y2 - y) < 3) continue;
        opts.push([x2, y2]);
      }
    }
    if (!opts.length) continue;
    const [tx, ty] = opts[Math.floor(Math.random() * opts.length)];
    chutes.push({hx: x + 0.5, hy: y + 0.5, tx: tx + 0.5, ty: ty + 0.5, color: CHUTE_COLORS[chutes.length]});
    used.add(x + ',' + y); used.add(tx + ',' + ty);
  }
}

// the twisty tube a chute follows from its mouth to its exit (a smooth wiggly line)
function chuteCurve(c){
  const dx = c.tx - c.hx, dy = c.ty - c.hy, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len, amp = Math.min(1.5, len * 0.2);
  const ctrl = [[c.hx, c.hy]];
  for (const [f, sgn] of [[0.25, 1], [0.5, -1], [0.75, 1]]){
    ctrl.push([clamp(c.hx + dx * f + nx * amp * sgn, 0.7, COLS - 0.7), clamp(c.hy + dy * f + ny * amp * sgn, 0.7, ROWS - 0.7)]);
  }
  ctrl.push([c.tx, c.ty]);
  const pts = [];
  for (let i = 0; i < ctrl.length - 1; i++){
    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];
    for (let k = 0; k < 12; k++){
      const t = k / 12, t2 = t * t, t3 = t2 * t;
      const cr = j => 0.5 * (2 * p1[j] + (p2[j] - p0[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (3 * p1[j] - p0[j] - 3 * p2[j] + p3[j]) * t3);
      pts.push([cr(0), cr(1)]);
    }
  }
  pts.push([c.tx, c.ty]);
  return pts;
}
function pathLen(pts){
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return L;
}
// a point a fraction u (0..1) of the way along the tube
function pathAt(pts, u){
  let want = clamp(u, 0, 1) * pathLen(pts);
  for (let i = 1; i < pts.length; i++){
    const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (want <= seg || i === pts.length - 1){
      const r = seg > 0 ? clamp(want / seg, 0, 1) : 0;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r];
    }
    want -= seg;
  }
  return pts[pts.length - 1];
}

// push the Moflin out of any wall or hurdle it overlaps, so it slides along them
function resolve(){
  for (let it = 0; it < 3; it++){
    let moved = false;
    for (const list of [segs, hsegs]){
      for (let i = 0; i < list.length; i++){
        const s = list[i];
        if (Math.abs(pos.x - (s[0] + s[2]) / 2) > 2 || Math.abs(pos.y - (s[1] + s[3]) / 2) > 2) continue;
        const abx = s[2] - s[0], aby = s[3] - s[1], l2 = abx * abx + aby * aby;
        let t = l2 > 0 ? ((pos.x - s[0]) * abx + (pos.y - s[1]) * aby) / l2 : 0;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const cx = s[0] + abx * t, cy = s[1] + aby * t;
        let ox = pos.x - cx, oy = pos.y - cy;
        const d = Math.hypot(ox, oy);
        if (d < s[4]){
          if (d < 1e-6){ ox = 1; oy = 0; } else { ox /= d; oy /= d; }
          pos.x = cx + ox * s[4]; pos.y = cy + oy * s[4];
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}

// move toward a target in small steps so it can never skip through a wall
function stepToward(tx, ty, maxMove){
  const dx = tx - pos.x, dy = ty - pos.y, d = Math.hypot(dx, dy);
  if (d < 1e-4) return;
  const m = Math.min(d, maxMove), n = Math.max(1, Math.ceil(m / 0.07));
  const sx = dx / d * m / n, sy = dy / d * m / n;
  for (let i = 0; i < n; i++){ pos.x += sx; pos.y += sy; resolve(); }
}

// is the Moflin right beside a hurdle (on either side)?
function nearHurdle(){
  for (const h of hurdles){
    const a = h.axis === 'x' ? pos.x - h.cx : pos.y - h.cy;
    const l = h.axis === 'x' ? pos.y - h.cy : pos.x - h.cx;
    if (Math.abs(a) <= 0.95 && Math.abs(l) <= 0.55) return h;
  }
  return null;
}
// ...and is that hurdle in the way of the goal?
function hurdleAhead(){
  const h = nearHurdle();
  if (!h) return null;
  const a = h.axis === 'x' ? pos.x - h.cx : pos.y - h.cy, s = a >= 0 ? 1 : -1;
  const mine  = h.axis === 'x' ? distGoal[h.y][h.x + s] : distGoal[h.y + s][h.x];
  const other = h.axis === 'x' ? distGoal[h.y][h.x - s] : distGoal[h.y - s][h.x];
  return mine > other ? h : null;
}
// where a jump over a hurdle lands: the same distance on the far side
function jumpLanding(h){
  const a = h.axis === 'x' ? pos.x - h.cx : pos.y - h.cy;
  const l = h.axis === 'x' ? pos.y - h.cy : pos.x - h.cx;
  const s = a >= 0 ? 1 : -1, la = clamp(l, -0.25, 0.25);
  return h.axis === 'x' ? {x: h.cx - s * 0.8, y: h.cy + la} : {x: h.cx + la, y: h.cy - s * 0.8};
}
function ladderAt(){
  for (const l of ladders) if (Math.hypot(pos.x - l.bx, pos.y - l.by) < 0.4) return l;
  return null;
}
function chuteAt(){
  for (const c of chutes) if (Math.hypot(pos.x - c.hx, pos.y - c.hy) < 0.4) return c;
  return null;
}
/*LOGIC-END*/

const f2 = n => Math.round(n * 100) / 100;
function rnd(seed){ const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// a wobbly, fluffy outline
function furPath(rx, ry, tufts, amp, seed){
  const n = tufts * 2, pts = [];
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const k = ((i % 2 === 0) ? 1 + amp : 1 - amp * 0.7) * (1 + (rnd(seed * 31 + i) - 0.5) * 0.03);
    pts.push([Math.cos(a) * rx * k, Math.sin(a) * ry * k]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]);
  let d = `M${f2(m0[0])} ${f2(m0[1])}`;
  for (let i = 0; i < n; i++){
    const p = pts[i], m = mid(p, pts[(i + 1) % n]);
    d += `Q${f2(p[0])} ${f2(p[1])} ${f2(m[0])} ${f2(m[1])}`;
  }
  return d + 'Z';
}

function moflinInner(t, id){
  let sk = '';
  for (let i = 0; i < 40; i++){
    const a = rnd(i * 3 + 1) * Math.PI * 2, rr = 0.2 + rnd(i * 3 + 2) * 0.7;
    const x = Math.cos(a) * rr * 38, y = Math.sin(a) * rr * 42;
    if (Math.abs(x) < 26 && y > -18 && y < 8) continue;
    const len = 4.5 + rnd(i * 3 + 3) * 4.5, dx = Math.cos(a) * len, dy = Math.sin(a) * len;
    sk += `M${f2(x)} ${f2(y)}q${f2(dx * .5 - dy * .3)} ${f2(dy * .5 + dx * .3)} ${f2(dx)} ${f2(dy)}`;
  }
  const body = furPath(42, 46, 15, .055, 1);
  let defs, over = '';
  if (t.rainbow){
    let stops = `<stop offset="0" stop-color="${RAINBOW[0]}"/>`;
    RAINBOW.forEach((c, i) => {
      stops += `<stop offset="${f2(i / 6 + 0.02)}" stop-color="${c}"/><stop offset="${f2((i + 1) / 6 - 0.02)}" stop-color="${c}"/>`;
    });
    stops += `<stop offset="1" stop-color="${RAINBOW[5]}"/>`;
    defs = `<linearGradient id="mg-${id}" x1=".05" y1=".12" x2=".95" y2=".88">${stops}</linearGradient>` +
           `<radialGradient id="mo-${id}" cx=".42" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#4B3A80" stop-opacity=".3"/></radialGradient>`;
    over = `<path d="${body}" fill="url(#mo-${id})"/>`;
  } else {
    defs = `<radialGradient id="mg-${id}" cx=".42" cy=".3" r=".85"><stop offset="0" stop-color="${t.light}"/><stop offset=".6" stop-color="${t.base}"/><stop offset="1" stop-color="${t.dark}"/></radialGradient>`;
  }
  return `<defs>${defs}</defs>
<path d="${body}" fill="url(#mg-${id})" stroke="${t.dark}" stroke-opacity=".45" stroke-width="1.2" stroke-linejoin="round"/>
${over}
<path d="${sk}" fill="none" stroke="${t.dark}" stroke-opacity=".38" stroke-width="1.6" stroke-linecap="round"/>
<path d="${furPath(24, 19, 9, .07, 4)}" transform="translate(0 25)" fill="${t.belly}" fill-opacity=".92"/>
<ellipse cx="-28" cy="6" rx="6.5" ry="4.4" fill="${t.blush}" fill-opacity=".42"/>

<g class="eyes-happy"><path d="M-21.5 -3.5Q-15 -13.5 -8.5 -3.5" fill="none" stroke="#2A2036" stroke-width="3.6" stroke-linecap="round"/><path d="M8.5 -3.5Q15 -13.5 21.5 -3.5" fill="none" stroke="#2A2036" stroke-width="3.6" stroke-linecap="round"/></g>`;
}

function audio(){
  if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(fa, fb, dur, o = {}){
  if (!soundOn) return;
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + (o.delay || 0), gain = o.gain || 0.1;
  const osc = ac.createOscillator(), gn = ac.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(fa, t0);
  osc.frequency.exponentialRampToValueAtTime(fb, t0 + dur * 0.8);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(gain, t0 + 0.02);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gn); gn.connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

function mixHex(a, b, t){
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = sh => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
  return '#' + ((1 << 24) + (ch(16) << 16) + (ch(8) << 8) + ch(0)).toString(16).slice(1);
}

function renderMaze(){
  let d = '';
  for (const s of segs){
    const x2 = (s[2] === s[0] && s[3] === s[1]) ? s[2] + 0.001 : s[2];
    d += `M${s[0]} ${s[1]}L${x2} ${s[3]}`;
  }

  // wooden ladders with lime up-arrows and a ladder badge at the foot
  let lad = '';
  for (const l of ladders){
    const dx = l.tx - l.bx, dy = l.ty - l.by, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const ang = f2(Math.atan2(dy, dx) * 180 / Math.PI);
    let rungs = '', arrows = '';
    for (let k = 0.35; k < len - 0.2; k += 0.38){
      rungs += `<line x1="${f2(k)}" y1="-.17" x2="${f2(k)}" y2=".17" stroke="#7A4B22" stroke-width=".1"/><line x1="${f2(k)}" y1="-.17" x2="${f2(k)}" y2=".17" stroke="#D9A066" stroke-width=".05"/>`;
    }
    for (let k = 1.9; k < len - 0.9; k += 2.2){
      arrows += `<g transform="translate(${f2(k)} 0)"><circle r=".2" fill="#6CC644" stroke="#2F7A1F" stroke-width=".05"/><path d="M-.07 -.09L.08 0L-.07 .09" fill="none" stroke="#fff" stroke-width=".065" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    }

      `<line x1="0" y1="-.17" x2="${f2(len)}" y2="-.17" stroke="#D9A066" stroke-width=".07" stroke-linecap="round"/><line x1="0" y1=".17" x2="${f2(len)}" y2=".17" stroke="#D9A066" stroke-width=".07" stroke-linecap="round"/>` + rungs;

    <line x1="-.24" y1="-.12" x2=".2" y2="-.12" stroke-width=".07"/><line x1="-.24" y1=".12" x2=".2" y2=".12" stroke-width=".07"/>
    <line x1="-.14" y1="-.12" x2="-.14" y2=".12" stroke-width=".055"/><line x1="-.02" y1="-.12" x2="-.02" y2=".12" stroke-width=".055"/><line x1=".1" y1="-.12" x2=".1" y2=".12" stroke-width=".055"/>
    <path d="M.24 -.08L.33 0L.24 .08" stroke-width=".065" stroke-linejoin="round"/>
  </g>
</g>`;
  }

  // twisty tube slides: striped tube, arrows showing the way down, a swirling funnel and an open exit
  let tubes = '';
  for (const c of chutes){
    const pts = chuteCurve(c);
    const path = 'M' + pts.map(p => f2(p[0]) + ' ' + f2(p[1])).join('L');
    const dark = mixHex(c.color, '#1E1633', .4), light = mixHex(c.color, '#FFFFFF', .5);
    const n = Math.max(2, Math.floor(pathLen(pts) / 1.7));
    let arrows = '';
    for (let i = 1; i <= n; i++){
      const u = i / (n + 1), p = pathAt(pts, u), q = pathAt(pts, Math.min(1, u + 0.015));

<g transform="translate(${c.hx} ${c.hy})">

  let hv = '';
  for (const h of hurdles){
    const [x1, y1, x2, y2] = h.axis === 'x' ? [0, -.55, 0, .55] : [-.55, 0, .55, 0];

  // the Moflin nest: a woven bowl with a fluffy lining; its front rim is drawn over the Moflin
  const TW_D = '#8A5F32', TW_M = '#B98A57', TW_L = '#E0BC86';
  let weave = '', weaveFront = '';
  for (let i = 0; i < 28; i++){
    const a = i / 28 * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    weave += `<line x1="${f2(ca * .36)}" y1="${f2(sa * .3)}" x2="${f2(ca * .56)}" y2="${f2(sa * .48)}" stroke="${i % 2 ? TW_L : TW_D}" stroke-width=".045" stroke-linecap="round"/>`;
  }
  for (let a = 0.12; a < Math.PI; a += 0.24){
    const ca = Math.cos(a), sa = Math.sin(a), k = Math.round(a / 0.24) % 2;
    weaveFront += `<line x1="${f2(ca * .37)}" y1="${f2(sa * .29)}" x2="${f2(ca * .56)}" y2="${f2(sa * .48)}" stroke="${k ? TW_L : TW_D}" stroke-width=".045" stroke-linecap="round"/>`;
  }
  const nestBack = `
<g transform="translate(${goal.x} ${goal.y + 0.04})">

  <ellipse cx=".03" cy=".1" rx=".58" ry=".5" fill="#33285A" opacity=".2"/>

  nestFront.setAttribute('viewBox', `0 0 ${COLS} ${ROWS}`);

  mazeSvg.setAttribute('viewBox', `0 0 ${COLS} ${ROWS}`);

<g fill="none" stroke-linejoin="round" stroke-linecap="round">

// ---------- layout ----------
function stageSize(){
  const cs = getComputedStyle(stage);
  return {
    aw: stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
    ah: stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
  };
}
function chooseDims(aw, ah){
  const w = clamp(Math.floor((aw / 40 - 1) / 2), 3, 7);
  const s0 = Math.min(aw / (2 * w + 1), 60);
  const h = clamp(Math.floor((ah / s0 - 1) / 2), 3, 8);
  return {w, h};
}
function applySize(){
  if (!g) return;
  const {aw, ah} = stageSize();
  S = Math.max(16, Math.floor(Math.min(aw / COLS, ah / ROWS, 64)));
  board.style.setProperty('--S', S + 'px');
  board.style.width = COLS * S + 'px';
  board.style.height = ROWS * S + 'px';
  place();
}
function place(){
  const box = S * 2.4;
  moflinEl.style.transform = `translate3d(${pos.x * S - box / 2}px,${pos.y * S - box / 2}px,0)`;
}
function toTile(e){
  const r = board.getBoundingClientRect();
  return {x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S};
}

// ---------- hints ----------
const HAND_TIP = 0.083;
function stopHint(){
  clearTimeout(idleTimer);
  if (hintAnim){ hintAnim.cancel(); hintAnim = null; }
  hintKind = '';
}
function nextDir(){
  const tx = Math.floor(pos.x), ty = Math.floor(pos.y);
  let best = null, bd = Infinity;
  for (const [dx, dy] of DIRS){
    const nx = tx + dx, ny = ty + dy;
    if (g[ny] && g[ny][nx] === 0 && distGoal[ny][nx] >= 0 && distGoal[ny][nx] < bd){ bd = distGoal[ny][nx]; best = [dx, dy]; }
  }
  return best;
}
function showDragHint(){
  stopHint();
  if (state !== 'play' || dragging || motion) return;
  const dir = nextDir(); if (!dir) return;
  const W = S * 1.6, bx = pos.x * S - W / 2, by = (pos.y + 0.3) * S - W * HAND_TIP;
  const dx = dir[0] * 1.7 * S, dy = dir[1] * 1.7 * S;
  hintKind = 'drag';
  hintAnim = hand.animate([
    {transform:`translate(${bx}px,${by}px) scale(1)`, opacity:0, offset:0, easing:'ease-out'},
    {transform:`translate(${bx}px,${by}px) scale(.92)`, opacity:1, offset:.15, easing:'ease-in-out'},
    {transform:`translate(${bx + dx}px,${by + dy}px) scale(.92)`, opacity:1, offset:.75, easing:'ease-out'},
    {transform:`translate(${bx + dx}px,${by + dy}px) scale(1)`, opacity:0, offset:1}
  ], {duration:1900, iterations:Infinity});
}
// a tapping hand: shown after winning, or when the Moflin is stuck at a hurdle
function showTapHint(){
  stopHint();
  if (!(state === 'won' || (state === 'play' && !motion && hurdleAhead()))) return;
  const W = S * 1.6, bx = pos.x * S - W / 2, by = (pos.y + 0.35) * S - W * HAND_TIP;
  hintKind = 'tap';
  hintAnim = hand.animate([
    {transform:`translate(${bx}px,${by + S * .5}px) scale(1)`, opacity:0, offset:0},
    {transform:`translate(${bx}px,${by + S * .1}px) scale(1)`, opacity:1, offset:.3},
    {transform:`translate(${bx}px,${by - S * .02}px) scale(.9)`, opacity:1, offset:.45},
    {transform:`translate(${bx}px,${by + S * .1}px) scale(1)`, opacity:1, offset:.6},
    {transform:`translate(${bx}px,${by + S * .5}px) scale(1)`, opacity:0, offset:1}
  ], {duration:1700, iterations:Infinity});
}
function idleHint(){
  if (state !== 'play' || dragging || motion) return;
  if (hurdleAhead()) showTapHint(); else showDragHint();
}
function scheduleIdle(ms){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(idleHint, ms);
}

// ---------- particles ----------
const CONF = ['#F0625A', '#FFC83D', '#3DBFA6', '#7B8CFF', '#FF8FB8', '#FFFFFF'];
const HEARTS = ['#F0625A', '#FF8FB8', '#FFC83D'];

function burst(n, box){
  const r = box || jumperEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if (reduceMotion()) n = Math.round(n / 3);
  for (let i = 0; i < n; i++){
    const el = document.createElement('i'), size = 6 + Math.random() * 8;
    el.className = 'conf';
    el.style.cssText = `width:${size}px;height:${size * (Math.random() < .5 ? 1 : .55)}px;background:${CONF[i % CONF.length]};left:${cx}px;top:${cy}px;border-radius:${Math.random() < .5 ? '50%' : '2px'}`;
    fx.appendChild(el);
    const ang = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.3, sp = 120 + Math.random() * 260;
    const dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp;
    const fall = window.innerHeight * .6 + Math.random() * 200, rot = (Math.random() - .5) * 720;
    const a = el.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx * .7}px,${dy * .7}px) rotate(${rot * .4}deg)`, opacity:1, offset:.35},
      {transform:`translate(${dx}px,${dy + fall}px) rotate(${rot}deg)`, opacity:0}
    ], {duration:1500 + Math.random() * 1100, easing:'cubic-bezier(.2,.7,.4,1)'});
    a.onfinish = () => el.remove();
  }
}
function floatHearts(n, box){
  const r = box || jumperEl.getBoundingClientRect();
  for (let i = 0; i < n; i++){
    const el = document.createElement('span'), sz = 16 + Math.random() * 14;
    el.className = 'fh';
    el.style.cssText = `left:${r.left + r.width / 2 + (Math.random() - .5) * r.width * .7}px;top:${r.top + r.height * .1}px;width:${sz}px;height:${sz}px`;
    el.innerHTML = `<svg viewBox="0 0 32 30"><path d="${HEART_D}" fill="${HEARTS[Math.floor(Math.random() * HEARTS.length)]}"/></svg>`;
    fx.appendChild(el);
    const rise = 60 + Math.random() * 60, drift = (Math.random() - .5) * 50;
    const a = el.animate([
      {transform:'translate(-50%,0) scale(.4)', opacity:0},
      {transform:`translate(calc(-50% + ${drift * .5}px),${-rise * .5}px) scale(1)`, opacity:1, offset:.3},
      {transform:`translate(calc(-50% + ${drift}px),${-rise}px) scale(.9)`, opacity:0}
    ], {duration:1100 + Math.random() * 400, easing:'ease-out'});
    a.onfinish = () => el.remove();
  }
}

// ---------- victory jumping (tap the Moflin after finishing) ----------
function hop(){
  hopping = true;
  const H = S * 1.15, dur = 520;
  const a = jumperEl.animate(hopFrames(H), {duration:dur});
  shadowEl.animate(shadowFrames, {duration:dur});
  squeak(1 + (hopIdx++ % 3) * 0.12);
  setTimeout(() => { if (hopping) floatHearts(2); }, dur * .35);
  a.onfinish = () => { hops--; if (hops > 0 && state === 'won') hop(); else { hops = 0; hopping = false; } };
  a.oncancel = () => { hopping = false; };
}
function queueHops(n){
  hops = Math.min(hops + n, 12);
  if (!hopping) hop();
}
function tapMoflin(){
  stopHint();
  moflinEl.classList.remove('invite');
  queueHops(3);
}

// ---------- jumping hurdles and riding chutes ----------
function smallHop(){
  jumperEl.animate(hopFrames(S * .55), {duration:420});
  shadowEl.animate(shadowFrames, {duration:420});
  squeak(1);
}
function startJump(h){
  const to = jumpLanding(h);
  stopHint();
  motion = {type:'jump', from:{x:pos.x, y:pos.y}, to, t0:performance.now(), dur:640};
  jumperEl.animate(hopFrames(S * 1.5), {duration:640});
  shadowEl.animate(shadowFrames, {duration:640});
  squeak(1.25);
  setTimeout(() => floatHearts(2), 260);
}
function startSlide(c){
  stopHint();
  dragging = false; moflinEl.classList.remove('held');
  motion = {type:'slide', cv:chuteCurve(c), t0:performance.now(), dur:1500};
  jumperEl.classList.add('sliding');
  jumperEl.animate(SLIDE_FRAMES, {duration:1500});
  shadowEl.animate([
    {opacity:1, offset:0}, {opacity:0, offset:.15}, {opacity:0, offset:.85}, {opacity:1, offset:1}
  ], {duration:1500});
  whee();
}
function startClimb(l){
  stopHint();
  dragging = false; moflinEl.classList.remove('held');
  const len = Math.hypot(l.tx - l.bx, l.ty - l.by), dur = clamp(900 + len * 90, 1200, 2000);
  motion = {type:'climb', cv:[[l.bx, l.by], [l.tx, l.ty]], t0:performance.now(), dur};
  jumperEl.animate(CLIMB_FRAMES, {duration:dur});
  climbSound();
}
const easeIO = q => q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
function runMotion(t){
  const m = motion, p = clamp((t - m.t0) / m.dur, 0, 1);
  if (m.type === 'jump'){
    const e = easeIO(p);
    pos.x = m.from.x + (m.to.x - m.from.x) * e;
    pos.y = m.from.y + (m.to.y - m.from.y) * e;
  } else {
    const u = m.type === 'climb' ? (p < .12 ? 0 : p < .88 ? easeIO((p - .12) / .76) : 1)
                                 : (p < .2 ? 0 : p < .88 ? easeIO((p - .2) / .68) : 1);
    const b = pathAt(m.cv, u);
    pos.x = b[0]; pos.y = b[1];
  }
  if (p >= 1) finishMotion();
}
function finishMotion(){
  const m = motion;
  motion = null;
  if (m.type === 'jump'){ resolve(); }
  else { jumperEl.classList.remove('sliding'); floatHearts(3); squeak(m.type === 'climb' ? 1.5 : 1.3); }
  nearT = performance.now();
  scheduleIdle(m.type === 'slide' ? 3500 : 4500);
}
function tapInPlay(){
  if (motion) return;
  const h = nearHurdle();
  if (h) startJump(h); else smallHop();
  scheduleIdle(4500);
}

const itemById = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const CATS = [{id:'head', icon:'crown'}, {id:'critter', icon:'catface'}, {id:'face', icon:'round'}, {id:'back', icon:'fairy'}];
const GHOST = (cx, cy) => `<ellipse cx="${cx}" cy="${cy}" rx="42" ry="46" fill="#33285A" fill-opacity=".07"/>`;
const thumb = it => `<svg viewBox="${it.vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">${it.slot === 'wings' ? GHOST(0, 0) : ''}${it.draw()}</svg>`;
const TILE_BG = {head:'#FFF1CF', critter:'#FFE1D2', face:'#DDF0FF', back:'#EDE3FF'};

let dressKey = 'pink', outfit = {}, tab = 'head', photoBusy = false, drag = null;

function wornGroup(it){
  const [ax, ay] = SLOTS[it.slot], h = HITS[it.slot];
  return `<g data-slot="${it.slot}" class="worn" transform="translate(${ax} ${ay})"><g class="pop">${it.draw()}</g>` +
         (h ? `<circle cx="${h[0]}" cy="${h[1]}" r="${h[2]}" fill="transparent"/>` : '') + `</g>`;
}
function dressedSVG(){
  const w = slot => outfit[slot] ? wornGroup(itemById[outfit[slot]]) : '';
  return `<svg viewBox="-96 -110 192 204" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">${w('wings')}${w('tail')}${moflinInner(THEMES[dressKey], 'dm')}${w('critter')}${w('hat')}${w('eyes')}${w('wand')}</svg>`;
}
function renderDress(){ dm.innerHTML = dressedSVG(); }

function renderTabs(){
  tabsEl.innerHTML = CATS.map(c => `<button class="tab" type="button" data-cat="${c.id}" aria-label="${{head:'Hats and crowns', critter:'Animal faces', face:'Glasses and masks', back:'Wings and tails'}[c.id]}" aria-selected="${c.id === tab}">${thumb(itemById[c.icon])}</button>`).join('');
}
function renderTray(){
  renderTabs();
  itemsEl.innerHTML = ITEMS.filter(i => i.cat === tab).map(i => `<button class="item" type="button" data-id="${i.id}" aria-label="${i.name}" style="--ib:${TILE_BG[i.cat]}">${thumb(i)}</button>`).join('');
}
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  audio(); pip(); tab = b.dataset.cat; renderTray(); scheduleDHint();
});

function layoutDress(){
  const r = dstage.getBoundingClientRect();
  dstage.style.setProperty('--dm', Math.max(160, Math.floor(Math.min(r.width - 20, r.height - 8))) + 'px');
}

// ---- sparkles, photo, hints ----
function sparkles(n, cx, cy){
  const cols = ['#FFC83D', '#fff', '#FF8FB8', '#7CC6F7'];
  for (let i = 0; i < n; i++){
    const el = document.createElement('span'), sz = 12 + Math.random() * 16;
    el.className = 'sp';
    el.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;margin:${-sz / 2}px 0 0 ${-sz / 2}px`;
    el.innerHTML = `<svg viewBox="0 0 20 20"><path d="M10 0Q10 10 20 10Q10 10 10 20Q10 10 0 10Q10 10 10 0Z" fill="${cols[i % 4]}"/></svg>`;
    fx.appendChild(el);
    const ang = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    const a = el.animate([
      {transform:'translate(0,0) scale(.3) rotate(0deg)', opacity:0},
      {transform:`translate(${Math.cos(ang) * d * .6}px,${Math.sin(ang) * d * .6}px) scale(1) rotate(90deg)`, opacity:1, offset:.4},
      {transform:`translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d}px) scale(.4) rotate(180deg)`, opacity:0}
    ], {duration:800 + Math.random() * 500, easing:'ease-out'});
    a.onfinish = () => el.remove();
  }
}
const dmCenter = () => { const r = dwrap.getBoundingClientRect(); return {x:r.left + r.width / 2, y:r.top + r.height * .5}; };
const wearSound = () => { tone(700, 1000, .1, {gain:.08}); tone(1000, 1500, .12, {gain:.08, delay:.09}); };

function popWorn(slot){
  const el = dm.querySelector(`[data-slot="${slot}"] .pop`);
  if (el) el.animate([{transform:'scale(1.5)', opacity:.6}, {transform:'scale(.92)', offset:.6}, {transform:'scale(1)', opacity:1}], {duration:380, easing:'ease-out'});
}
function dmHop(H){
  dm.animate(hopFrames(H), {duration:480});
  dshadow.animate(shadowFrames, {duration:480});
}
function wear(it){
  outfit[it.slot] = it.id;
  renderDress(); popWorn(it.slot);
  wearSound(); dmHop(dwrap.offsetHeight * .06);
  const c = dmCenter(); sparkles(7, c.x, c.y - dwrap.offsetHeight * .1);
}
function pet(){
  dmHop(dwrap.offsetHeight * .05); squeak(1 + Math.random() * .3);
}

// ---- dragging pieces on (and off) ----
function beginDrag(e, id, fromWorn, holder){
  const it = itemById[id];
  const el = document.createElement('div');
  el.className = 'dragitem'; el.innerHTML = thumb(it);
  document.body.appendChild(el);
  drag = {it, el, pid:e.pointerId, lift:e.pointerType === 'touch' ? 48 : 0, fromWorn, over:false, x:e.clientX, y:e.clientY, holder};
  try { holder.setPointerCapture(e.pointerId); } catch (_) {}
  stopDHint(); moveDrag(e);
  el.animate([{opacity:.6, scale:'.7'}, {opacity:1, scale:'1.12'}], {duration:160, fill:'forwards'});
}
function moveDrag(e){
  if (!drag || e.pointerId !== drag.pid) return;
  const x = e.clientX, y = e.clientY - drag.lift;
  drag.x = x; drag.y = y;
  drag.el.style.transform = `translate(${x - 52}px,${y - 52}px)`;
  const r = dwrap.getBoundingClientRect(), mx = r.width * .12, my = r.height * .06;
  const over = x > r.left + mx && x < r.right - mx && y > r.top + my && y < r.bottom - my;
  if (over !== drag.over){ drag.over = over; dwrap.classList.toggle('over', over); }
}
function endDrag(e, cancelled){
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  dwrap.classList.remove('over');
  if (d.over && !cancelled){
    d.el.remove(); wear(d.it);
  } else {
    d.el.animate([{opacity:1}, {opacity:0, transform:d.el.style.transform + ' scale(.5)'}], {duration:200}).onfinish = () => d.el.remove();
    if (d.fromWorn){ sparkles(5, d.x, d.y); tone(500, 260, .18, {gain:.07}); renderDress(); }
    scheduleDHint();
  }
}
itemsEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('.item');
  if (!b || drag) return;
  e.preventDefault(); audio(); pip();
  beginDrag(e, b.dataset.id, false, itemsEl);
});
// keyboard: Enter or Space on a tray item puts it straight on the Moflin
itemsEl.addEventListener('click', e => {
  if (e.detail !== 0) return;
  const b = e.target.closest('.item'); if (!b) return;
  audio(); wear(itemById[b.dataset.id]);
});
dwrap.addEventListener('pointerdown', e => {
  if (drag) return;
  e.preventDefault(); audio();
  const g = e.target.closest('[data-slot]');
  if (!g){ pet(); return; }
  const slot = g.dataset.slot, id = outfit[slot];
  if (!id) return;
  outfit[slot] = null; renderDress();       // lift it off; it goes back on if you drop it on the Moflin
  beginDrag(e, id, true, dwrap);
  moveDrag(e);
});
for (const h of [itemsEl, dwrap]){
  h.addEventListener('pointermove', moveDrag);
  h.addEventListener('pointerup', e => endDrag(e, false));
  h.addEventListener('pointercancel', e => endDrag(e, true));
}

// ---- camera: pose, flash, photo ----
const poseFrames = H => [
  {transform:'translateY(0) rotate(0deg) scale(1,1)', offset:0, easing:'ease-out'},
  {transform:'translateY(0) rotate(0deg) scale(1.1,.9)', offset:.14, easing:'ease-out'},
  {transform:`translateY(${-H}px) rotate(-6deg) scale(.95,1.07)`, offset:.36, easing:'ease-in'},
  {transform:'translateY(0) rotate(-6deg) scale(1.1,.92)', offset:.52, easing:'ease-out'},
  {transform:'translateY(0) rotate(-7deg) scale(1.07)', offset:.62},

const OPP_BASE = [5.4, 6.0, 6.6];
// The friends race along on their own, but slow right down near the finish and are held back
// if they get far ahead, so a child who keeps tapping always gets there first.
function oppSpeed(base, wob, prog, playerProg){
  const m = prog < 70 ? 1 : prog < 92 ? 1 - (prog - 70) / 22 * 0.88 : 0.12;
  const catchup = clamp(1 + (playerProg - prog) / 80, 0.6, 1.25);
  return base * wob * m * catchup;
}

function buildRace(){
  const token = ++raceToken;

  const playerLane = Math.floor(Math.random() * 4);
  const animals = shuffle(ANIMALS.slice()), bases = shuffle(OPP_BASE.slice()), cols = OTHER_COLORS[raceType];
  let ai = 0;
  for (let i = 0; i < 4; i++){
    const lane = document.createElement('div');
    lane.className = 'lane' + (i === playerLane ? ' mine' : '');
    lanesEl.appendChild(lane);
    const mine = i === playerLane;
    const kind = mine ? 'moflin' : animals[ai];
    const color = mine ? PLAYER_COLOR[raceType] : cols[ai];
    const rider = mine ? moflinInner(THEMES[raceKey], 'rp') : animalInner(kind);
    const el = document.createElement('div');
    el.className = 'racer';
    el.innerHTML = `<div class="rbody">${vehicleSVG(raceType, color, rider)}</div>`;
    lane.appendChild(el);
    const r = {i, kind, mine, el, lane, body:el.firstChild, prog:0, target:0, speed:0, finished:false, place:0, puffT:0,
               base:mine ? 0 : bases[ai], f:.7 + Math.random() * .6, ph:Math.random() * 6.28, lastTap:0,
               wheels:[...el.querySelectorAll('.wheel')], legs:[...el.querySelectorAll('.leg')]};

function layoutRace(){
  if (!race) return;
  const r = lanesEl.getBoundingClientRect();
  race.W = r.width; race.LH = r.height / 4;
  race.vw = Math.min(race.LH * .92 * 1.43, race.W * .34); race.vh = race.vw / 1.43;
  race.startX = race.W * .03; race.finishX = race.W - 62;
  race.track = race.finishX - race.vw * .92 - race.startX;
  lanesEl.style.setProperty('--vw', race.vw + 'px');
  lanesEl.style.setProperty('--vh', race.vh + 'px');
  lanesEl.style.setProperty('--fin', race.finishX + 'px');
  lanesEl.style.setProperty('--sl', (race.startX + race.vw * .08) + 'px');
  renderRacers(performance.now(), 0);
}
function spawnPuff(r, x, y){
  const {vw, vh} = race, t = race.type;
  let px, py, col, size, dx, dy;
  if (t === 'car'){ px = x + vw * .04; py = y + vh * .8; col = 'rgba(120,120,140,.55)'; size = 8 + Math.random() * 6; dx = -28; dy = -6; }
  else if (t === 'train'){ px = x + vw * .78; py = y + vh * .2; col = 'rgba(255,255,255,.9)'; size = 10 + Math.random() * 8; dx = -22; dy = -30; }
  else if (t === 'plane'){ px = x + vw * .06; py = y + vh * .62; col = 'rgba(255,255,255,.85)'; size = 8 + Math.random() * 6; dx = -34; dy = 0; }
  else { px = x + vw * .32; py = y + vh * .94; col = 'rgba(160,120,70,.6)'; size = 7 + Math.random() * 6; dx = -26; dy = -8; }
  const el = document.createElement('i');
  el.className = 'puff';
  el.style.cssText = `left:${px - size / 2}px;top:${py - size / 2}px;width:${size}px;height:${size}px;background:${col}`;
  r.lane.appendChild(el);
  const a = el.animate([{transform:'translate(0,0) scale(.6)', opacity:.9}, {transform:`translate(${dx}px,${dy}px) scale(1.8)`, opacity:0}], {duration:700, easing:'ease-out'});
  a.onfinish = () => el.remove();
}
function renderRacers(now, dt){
  const {vh, LH, type} = race, y = LH - vh - LH * .04;
  for (const r of race.racers){
    const x = race.startX + r.prog / 100 * race.track;
    r.el.style.transform = `translate3d(${x}px,${y}px,0)`;
    const mv = clamp((r.speed || 0) / 5, 0, 1);
    const tilt = type === 'plane' ? Math.sin(now / 400 + r.i) * 2.2 : type === 'horse' ? -mv * 2 : 0;
    const bob = type === 'plane' ? Math.sin(now / 500 + r.i * 2) * 2.5 : Math.sin(r.prog * .9) * mv * 1.6;
    r.body.style.transform = `translateY(${bob.toFixed(2)}px) rotate(${tilt.toFixed(2)}deg)`;
    const spin = (r.prog * 14) % 360;
    for (const w of r.wheels) w.setAttribute('transform', `rotate(${spin.toFixed(1)} ${w.dataset.cx} ${w.dataset.cy})`);
    for (const l of r.legs) l.setAttribute('transform', `rotate(${(Math.sin(r.prog * .9 + parseFloat(l.dataset.ph)) * 36 * mv).toFixed(1)} ${l.dataset.cx} ${l.dataset.cy})`);
    r.puffT += dt;
    if (mv > .3 && r.puffT > .11){ r.puffT = 0; spawnPuff(r, x, y); }
  }
}

function raceStep(dt, t){

  const now = performance.now(), p = race.player;
  if (!p.finished){
    const d = p.target - p.prog;
    if (d > 0){ const s = Math.min(d, 60 * dt); p.prog += s; p.speed = s / dt; } else p.speed = 0;
  }
  for (const o of race.racers){
    if (o.mine || o.finished) continue;
    const wob = 1 + 0.18 * Math.sin(now / 1000 * o.f + o.ph);
    let sp = oppSpeed(o.base, wob, o.prog, p.prog);
    if (race.phase === 'done') sp = Math.max(sp * 3, 45);      // once the child is home, let everyone finish quickly
    o.prog = Math.min(100, o.prog + sp * dt); o.speed = sp;

// ---------- spelling: drag the letter blocks into the slots ----------
/*SPELL-START*/
const WORDS3 = [['cat','🐱'],['dog','🐶'],['sun','☀️'],['bus','🚌'],['hat','🎩'],['pig','🐷'],['bed','🛏️'],['fox','🦊'],['bee','🐝'],['cow','🐮'],
                ['car','🚗'],['egg','🥚'],['key','🔑'],['box','📦'],['ant','🐜'],['owl','🦉'],['bug','🐛'],['pie','🥧'],['van','🚐'],['ear','👂']];
const WORDS4 = [['fish','🐟'],['duck','🦆'],['frog','🐸'],['moon','🌙'],['star','⭐'],['bird','🐦']];

// where everything sits on the board (all in pixels), for a word of n letters
function spellGeom(W, H, n){
  const gap = Math.max(8, Math.round(W * .025));
  let b = Math.max(44, Math.floor(Math.min(96, (W - 24 - gap * (n - 1)) / n, H * .2)));
  let P = Math.floor(Math.min(W * .56, H * .38, 220));
  const need = () => P + 20 + b + 30 + b;
  while (need() > H - 8 && (P > 84 || b > 44)){ if (P > 84) P -= 6; if (need() > H - 8 && b > 44) b -= 3; }
  const total = need();
  const top = Math.max(4, Math.floor((H - total) * .4));
  const rowW = n * b + (n - 1) * gap, x0 = Math.round((W - rowW) / 2);
  const y0 = top + P + 20, y1 = y0 + b + 30;
  const M = Math.max(44, Math.min(P * .5, (W - P) / 2 - 6, 96));
  return {gap, b, P, top, x0, y0, y1, M, rowW, total};
}
// the blocks start in a jumbled order (never already spelled)
function spellShuffle(word){
  const src = word.toUpperCase().split('');
  let a;
  do { a = shuffle(src.slice()); } while (a.join('') === src.join('') && new Set(src).size > 1);
  return a;
}
/*SPELL-END*/

const spellScr = $('#spell'), sboard = $('#sboard'), sMoflinBtn = $('#sMoflinBtn');
const BLOCK_COLS = ['#F0625A', '#3E9BF2', '#2FAE93', '#8E6BE8', '#E9962B', '#E0559E'];
let spellKey = 'gold', sp = null, sBag = {3:[], 4:[]}, sHintTimer = 0, sHintAnim = null;

function nextSpellWord(){
  const four = Math.random() < .25, len = four ? 4 : 3, list = four ? WORDS4 : WORDS3;
  if (!sBag[len].length) sBag[len] = shuffle(list.slice());
  return sBag[len].pop();
}
const slotPitch = i => [523.25, 587.33, 659.25, 783.99][i % 4];

function buildWord(){
  stopSHint();
  const [word, emoji] = nextSpellWord();
  const letters = spellShuffle(word), n = word.length;
  sboard.innerHTML = '';
  sp = {word:word.toUpperCase(), emoji, n, done:false, drag:null, busy:0, slots:[], blocks:[], g:null, lastSlotMiss:-1};
  const band = document.createElement('div'); band.className = 'sband'; sboard.appendChild(band); sp.band = band;
  const pic = document.createElement('button');
  pic.className = 'spic'; pic.type = 'button'; pic.setAttribute('aria-label', 'Picture: ' + word);
  pic.innerHTML = `<span>${emoji}</span>`; sboard.appendChild(pic); sp.pic = pic;
  const mo = document.createElement('div'); mo.className = 'smoflin'; mo.setAttribute('role', 'button'); mo.setAttribute('aria-label', 'Moflin');
  mo.innerHTML = `<div class="smoj">${moflinSVG(THEMES[spellKey], 'sp')}</div>`; sboard.appendChild(mo); sp.mo = mo;
  const nx = document.createElement('button'); nx.className = 'snext'; nx.type = 'button'; nx.setAttribute('aria-label', 'Next word');

  for (let i = 0; i < n; i++){
    const s = document.createElement('div'); s.className = 'sslot'; sboard.appendChild(s);
    sp.slots.push({el:s, filled:false, misses:0, cx:0, cy:0, x:0, y:0});

    el.style.background = BLOCK_COLS[i % BLOCK_COLS.length];

  });

  pic.animate([{transform:'scale(.6) rotate(-6deg)', opacity:0}, {transform:'scale(1.06) rotate(2deg)', offset:.7}, {transform:'scale(1) rotate(0)', opacity:1}], {duration:460, easing:'ease-out'});
  scheduleSHint(3800);
}

function layoutSpell(initial){
  if (!sp) return;
  const r = sboard.getBoundingClientRect(), W = r.width, H = r.height;
  if (!W || !H) return;
  const g = spellGeom(W, H, sp.n); sp.g = g;
  sboard.style.setProperty('--b', g.b + 'px');
  Object.assign(sp.pic.style, {left:Math.round((W - g.P) / 2) + 'px', top:g.top + 'px', width:g.P + 'px', height:g.P + 'px'});
  sp.pic.firstChild.style.fontSize = Math.round(g.P * .62) + 'px';
  const mx = Math.max(2, Math.round((W - g.P) / 2 - g.M - 4)), my = g.top + g.P - g.M;
  Object.assign(sp.mo.style, {left:mx + 'px', top:my + 'px', width:g.M + 'px', height:g.M + 'px'});
  const nxSize = Math.round(g.M * .82);
  Object.assign(sp.nx.style, {left:Math.round((W + g.P) / 2 + 8 + (g.M - nxSize) / 2) + 'px', top:(g.top + g.P - nxSize - 4) + 'px', width:nxSize + 'px', height:nxSize + 'px'});
  Object.assign(sp.band.style, {left:Math.max(0, g.x0 - 14) + 'px', width:Math.min(W, g.rowW + 28) + 'px', top:(g.y0 - 12) + 'px', height:(g.b + 24) + 'px'});
  sp.slots.forEach((s, i) => {
    s.x = g.x0 + i * (g.b + g.gap); s.y = g.y0; s.cx = s.x + g.b / 2; s.cy = s.y + g.b / 2;
    Object.assign(s.el.style, {left:s.x + 'px', top:s.y + 'px', width:g.b + 'px', height:g.b + 'px'});
  });
  sp.blocks.forEach((blk, i) => {
    blk.hx = g.x0 + i * (g.b + g.gap); blk.hy = g.y1;
    if (blk.placed >= 0){ blk.x = sp.slots[blk.placed].x; blk.y = sp.slots[blk.placed].y; }
    else if (!sp.drag || sp.drag.blk !== blk){ blk.x = blk.hx; blk.y = blk.hy; }
    blk.el.style.transform = `translate(${blk.x}px,${blk.y}px)`;
  });
}
const sboardPos = e => { const r = sboard.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top, r}; };
const sToPage = (x, y) => { const r = sboard.getBoundingClientRect(); return {x:r.left + x, y:r.top + y}; };

// ---- dragging blocks ----
sboard.addEventListener('pointerdown', e => {
  if (!sp || sp.done) return;
  const el = e.target.closest('.sblock');
  if (!el){
    if (e.target.closest('.spic')){ audio(); pip(); sp.pic.animate([{transform:'rotate(0)'}, {transform:'rotate(-5deg) scale(1.05)'}, {transform:'rotate(4deg)'}, {transform:'rotate(0)'}], {duration:380}); }
    else if (e.target.closest('.smoflin')){ audio(); spellHop(false); }
    return;
  }
  const blk = sp.blocks[+el.dataset.i];
  if (!blk || blk.placed >= 0 || blk.busy || sp.drag) return;
  e.preventDefault(); audio(); pip(); stopSHint();
  const p = sboardPos(e), b = sp.g.b;
  sp.drag = {blk, pid:e.pointerId, lift:e.pointerType === 'touch' ? 44 : 0, dx:p.x - (blk.x + b / 2), dy:p.y - (blk.y + b / 2), hot:-1};
  el.classList.add('lift');
  try { sboard.setPointerCapture(e.pointerId); } catch (_) {}
  dragBlockTo(e);
});
function nearestSlot(cx, cy){
  let best = -1, bd = 1e9;
  sp.slots.forEach((s, i) => { if (s.filled) return; const d = Math.hypot(cx - s.cx, cy - s.cy); if (d < bd){ bd = d; best = i; } });
  return bd < sp.g.b * .85 ? best : -1;
}
function dragBlockTo(e){
  const d = sp && sp.drag; if (!d || e.pointerId !== d.pid) return;
  const p = sboardPos(e), b = sp.g.b;
  d.blk.x = p.x - d.dx - b / 2; d.blk.y = p.y - d.dy - d.lift - b / 2;
  d.blk.el.style.transform = `translate(${d.blk.x}px,${d.blk.y}px) scale(1.1)`;
  const hot = nearestSlot(d.blk.x + b / 2, d.blk.y + b / 2);
  if (hot !== d.hot){
    if (d.hot >= 0) sp.slots[d.hot].el.classList.remove('hot');
    if (hot >= 0) sp.slots[hot].el.classList.add('hot');
    d.hot = hot;
  }
}
function endDragBlock(e, cancelled){
  const d = sp && sp.drag; if (!d || (e && e.pointerId !== d.pid)) return;
  sp.drag = null;
  d.blk.el.classList.remove('lift');
  sp.slots.forEach(s => s.el.classList.remove('hot'));
  const b = sp.g.b, cx = d.blk.x + b / 2, cy = d.blk.y + b / 2;
  const i = cancelled ? -1 : nearestSlot(cx, cy);
  if (i < 0){ sendHome(d.blk); scheduleSHint(5000); return; }
  if (sp.word[i] === d.blk.ch) placeBlock(d.blk, i); else wrongDrop(d.blk, i);
}
sboard.addEventListener('pointermove', dragBlockTo);
sboard.addEventListener('pointerup', e => endDragBlock(e, false));
sboard.addEventListener('pointercancel', e => endDragBlock(e, true));

function flyTo(blk, x, y, ms, ease, done){
  const from = `translate(${blk.x}px,${blk.y}px)`, to = `translate(${x}px,${y}px)`;
  blk.busy = true; blk.x = x; blk.y = y;
  const a = blk.el.animate([{transform:from + ' scale(1.1)'}, {transform:to + ' scale(1)'}], {duration:ms, easing:ease || 'cubic-bezier(.3,1.3,.5,1)'});
  blk.el.style.transform = to;
  a.onfinish = () => { blk.busy = false; if (done) done(); };
  a.oncancel = () => { blk.busy = false; };
}
function sendHome(blk){ flyTo(blk, blk.hx, blk.hy, 300); }

function placeBlock(blk, i){
  const s = sp.slots[i];
  s.filled = true; blk.placed = i;
  blk.el.classList.add('placed'); blk.el.setAttribute('tabindex', '-1');
  flyTo(blk, s.x, s.y, 260, 'cubic-bezier(.2,1.5,.4,1)', () => {
    blk.el.animate([{transform:`translate(${s.x}px,${s.y}px) scale(1)`}, {transform:`translate(${s.x}px,${s.y - sp.g.b * .16}px) scale(1.08,.94)`, offset:.4}, {transform:`translate(${s.x}px,${s.y}px) scale(1)`}], {duration:260});
  });
  s.el.classList.add('ok');
  tone(slotPitch(i), slotPitch(i) * 1.005, .3, {type:'triangle', gain:.1});
  const pt = sToPage(s.cx, s.cy); sparkles(6, pt.x, pt.y);

  if (sp.slots.every(x => x.filled)) finishWord(); else scheduleSHint(5000);
}
function wrongDrop(blk, i){

  s.el.animate([{transform:'translateX(0)'}, {transform:'translateX(-6px)'}, {transform:'translateX(6px)'}, {transform:'translateX(-4px)'}, {transform:'translateX(0)'}], {duration:340});
  sendHome(blk);

// a gentle nudge after a couple of wrong tries: the right block wobbles
function glowRight(i){
  sp.blocks.filter(b => b.placed < 0 && b.ch === sp.word[i]).forEach(b => {
    b.el.animate([{transform:`translate(${b.x}px,${b.y}px) scale(1)`}, {transform:`translate(${b.x}px,${b.y - sp.g.b * .12}px) scale(1.14)`, offset:.5}, {transform:`translate(${b.x}px,${b.y}px) scale(1)`}], {duration:700, iterations:3});
  });
}
// keyboard: Enter or Space sends a block to the next slot it belongs in
sboard.addEventListener('keydown', e => {
  if (!sp || sp.done || (e.key !== 'Enter' && e.key !== ' ')) return;
  const el = e.target.closest && e.target.closest('.sblock'); if (!el) return;
  e.preventDefault(); audio();
  const blk = sp.blocks[+el.dataset.i]; if (!blk || blk.placed >= 0 || blk.busy) return;

function spellHop(big){

function finishWord(){
