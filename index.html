// ---------- game flow ----------
// every game has a hurdle to hop. Sometimes there are two (and nothing else);
// otherwise there is one, plus a random extra: nothing, one chute or one ladder
function randomFeatures(){
  if (Math.random() < 0.35) return {hurdles:2, chutes:0, ladders:0};
  const f = {hurdles:1, chutes:0, ladders:0};
  if (Math.random() >= 0.2) f[Math.random() < 0.5 ? 'chutes' : 'ladders'] = 1;
  return f;
}
function show(screen){
  home.hidden = screen !== 'home';
  pick.hidden = screen !== 'pick';
  play.hidden = screen !== 'play';
  dress.hidden = screen !== 'dress';
  vehicleScr.hidden = screen !== 'vehicle';
  raceScr.hidden = screen !== 'race';
  spellScr.hidden = screen !== 'spell';
}
function startGame(key){
  currentGame = 'maze';
  jumperEl.innerHTML = moflinSVG(THEMES[key], 'game');
  moflinBtn.innerHTML = moflinSVG(THEMES[key], 'btn');
  show('play');
  newMaze();
}
function goHub(){
  state = 'home';
  stopHint(); resetActors(); leaveDress(); leaveRace(); leaveSpell();
  show('home'); layoutHome();
}
function goPick(game){
  pendingGame = game || currentGame;
  pickTitle.textContent = GAMES.find(g => g.id === pendingGame).label;
  state = 'pick';
  stopHint(); resetActors(); leaveDress(); leaveRace(); leaveSpell();
  show('pick'); layoutPick();
}
function resetActors(){
  jumperEl.getAnimations().forEach(a => a.cancel());
  shadowEl.getAnimations().forEach(a => a.cancel());
  hops = 0; hopping = false; glide = null; motion = null; dragging = false; nearT = 0;
  fx.innerHTML = '';
  moflinEl.classList.remove('invite', 'held');
  jumperEl.classList.remove('happy', 'sliding');
  againBtn.classList.remove('show');
  sr.textContent = '';
}
function newMaze(){
  stopHint(); resetActors();
  const {aw, ah} = stageSize(), {w, h} = chooseDims(aw, ah);
  buildMaze(w, h, randomFeatures()); renderMaze();
  pos.x = 1.5; pos.y = 1.5; vx = 0;
  applySize();
  state = 'play';
  setTimeout(() => { if (state === 'play' && !motion) showDragHint(); }, 500);
}
function win(){
  if (state !== 'play') return;
  state = 'won';
  dragging = false; moflinEl.classList.remove('held');
  stopHint();
  glide = {fx:pos.x, fy:pos.y, t0:performance.now(), dur:380};
  jumperEl.classList.add('happy');
  moflinEl.classList.add('invite');
  jingle(); burst(64);
  sr.textContent = 'You did it! Tap the Moflin to make it jump.';
  setTimeout(() => againBtn.classList.add('show'), 700);
  setTimeout(() => { if (state === 'won' && hops === 0 && moflinEl.classList.contains('invite')) showTapHint(); }, 1500);
}

// ---------- dragging and tapping ----------
moflinEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio();
  if (state === 'won'){ tapMoflin(); return; }
  if (state !== 'play' || motion) return;
  try { moflinEl.setPointerCapture(e.pointerId); } catch (_) {}
  dragging = true; moved = false; pid = e.pointerId; downT = performance.now();
  ptr = toTile(e); downPtr = {x:ptr.x, y:ptr.y};
  off = {x: pos.x - ptr.x, y: pos.y - ptr.y};
  const len = Math.hypot(off.x, off.y);
  if (len > 1){ off.x /= len; off.y /= len; }
  rest = e.pointerType === 'touch' ? {x:0, y:-0.32} : {x:0, y:0};
  moflinEl.classList.add('held');
  stopHint();
  nearT = performance.now();
});
moflinEl.addEventListener('pointermove', e => {
  if (!dragging || e.pointerId !== pid) return;
  ptr = toTile(e);
  if (!moved && Math.hypot(ptr.x - downPtr.x, ptr.y - downPtr.y) > 0.14){ moved = true; pip(); }
});
function release(e){
  if (!dragging || (e && e.pointerId !== pid)) return;
  const wasTap = !moved && e && e.type === 'pointerup' && performance.now() - downT < 500;
  dragging = false;
  moflinEl.classList.remove('held');
  if (wasTap){ tapInPlay(); return; }
  scheduleIdle(hurdleAhead() ? 1800 : 6500);
}
moflinEl.addEventListener('pointerup', release);
moflinEl.addEventListener('pointercancel', release);
moflinEl.addEventListener('contextmenu', e => e.preventDefault());

// keyboard: arrows / WASD to move, Space or Enter on the Moflin to jump
const KEYMAP = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', a:'left', d:'right', w:'up', s:'down'};
addEventListener('keydown', e => {
  const m = KEYMAP[e.key];
  if (state === 'play' && m){ keys[m] = true; stopHint(); e.preventDefault(); }
  else if ((e.key === ' ' || e.key === 'Enter') && document.activeElement === moflinEl){
    e.preventDefault();
    if (state === 'won') tapMoflin(); else if (state === 'play') tapInPlay();
  }
});
addEventListener('keyup', e => { const m = KEYMAP[e.key]; if (m) keys[m] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.up = keys.down = false; });

// ---------- buttons ----------
$('#homeBtn').addEventListener('click', goHub);
$('#pickHome').addEventListener('click', goHub);
moflinBtn.addEventListener('click', () => goPick('maze'));
$('#dHomeBtn').addEventListener('click', goHub);
dMoflinBtn.addEventListener('click', () => goPick('dressup'));
$('#vHomeBtn').addEventListener('click', goHub);
vMoflinBtn.addEventListener('click', () => goPick('races'));
$('#rHomeBtn').addEventListener('click', goHub);
$('#sHomeBtn').addEventListener('click', goHub);
sMoflinBtn.addEventListener('click', () => goPick('spelling'));
rMoflinBtn.addEventListener('click', () => goPick('races'));
rVehicleBtn.addEventListener('click', goVehicle);
rAgainBtn.addEventListener('click', () => { audio(); pip(); startRace(raceType); });
const nextMaze = () => { audio(); pip(); newMaze(); };
$('#newBtn').addEventListener('click', nextMaze);
againBtn.addEventListener('click', nextMaze);

// ---------- main loop ----------
function tick(t){
  requestAnimationFrame(tick);          // schedule the next frame first, so one hiccup can never stop the loop
  const dt = clamp((t - last) / 1000 || 0.016, 0.001, 0.05);
  last = t;
  const px = pos.x, py = pos.y;

  if (motion){
    runMotion(t);
  } else if (state === 'play'){
    if (dragging){
      if (moved){
        const k = Math.min(1, dt * 7);
        off.x += (rest.x - off.x) * k; off.y += (rest.y - off.y) * k;
      }
      stepToward(ptr.x + off.x, ptr.y + off.y, 26 * dt);
    } else {
      const kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), ky = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      if (kx || ky) stepToward(pos.x + kx, pos.y + ky, 4.5 * dt);
    }
    const c = chuteAt(), l = c ? null : ladderAt();
    if (c) startSlide(c);
    else if (l) startClimb(l);
    else if (Math.hypot(pos.x - goal.x, pos.y - goal.y) < 0.42) win();
    else {
      // stuck at a hurdle for a while? show the tapping hand
      if (hurdleAhead()){
        if (!nearT) nearT = t;
        if (t - nearT > 2200 && !hintAnim) showTapHint();
      } else {
        nearT = 0;
        if (hintAnim && hintKind === 'tap') stopHint();
      }
    }
  }
  if (glide){
    const p = clamp((t - glide.t0) / glide.dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
    pos.x = glide.fx + (goal.x - glide.fx) * e;
    pos.y = glide.fy + (goal.y + 0.06 - glide.fy) * e;
    if (p >= 1) glide = null;
  }
  if (state === 'race') raceStep(dt, t);
  if (g && (pos.x !== px || pos.y !== py)) place();

  vx += (((pos.x - px) / dt) - vx) * Math.min(1, dt * 10);
  tiltEl.style.transform = motion && motion.type !== 'jump' ? 'none' : `rotate(${clamp(vx * 3.2, -14, 14)}deg)`;
}
requestAnimationFrame(tick);

// ---------- resize ----------
let rz = 0;
addEventListener('resize', () => {
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(() => {
    if (!home.hidden){ layoutHome(); return; }
    if (!dress.hidden){ layoutDress(); scheduleDHint(); return; }
    if (!spellScr.hidden){ layoutSpell(); if (sHintAnim) showSHint(); return; }
    if (!vehicleScr.hidden){ layoutVehicle(); return; }
    if (!raceScr.hidden){ layoutRace(); if (rHintAnim) showRaceHint(); return; }
    if (!pick.hidden){ layoutPick(); return; }
    applySize();
    if (hintAnim){ if (hintKind === 'tap') showTapHint(); else showDragHint(); }
  });
});

layoutHome();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutHome(); layoutPick(); });
})();
</script>
</body>
</html>
